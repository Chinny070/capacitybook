name: ci

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m py_compile contracts/capacitybook.py contracts/capacity_guard.py
      - run: pytest -q tests/test_static.py
      - run: python scripts/preflight.py
